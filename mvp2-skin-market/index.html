<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NORVEX SHOP // Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Minimalist Titanium & Graphite Palette */
      --bg: #0d0e12;
      --bg-surface: #15171d;
      --bg-surface-elevated: #1e2129;
      --bg-surface-hover: #282c37;
      
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-strong: rgba(255, 255, 255, 0.25);
      
      --text-main: #ffffff;
      --text-secondary: #c8ccd6;
      --text-muted: #808696;
      --text-dim: #505666;
      
      --accent: #f2f4f8;
      --accent-dark: #0d0e12;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.18);
      --admin-gold: #f59e0b;
      
      --badge-hit: #f97316;
      --badge-sale: #ef4444;
      --badge-new: #06b6d4;
      --badge-top: #a855f7;
      
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-viewport {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 16px 16px calc(88px + env(safe-area-inset-bottom, 16px)) 16px;
      position: relative;
    }

    /* Minimalist Clean Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-icon-box {
      width: 44px;
      height: 44px;
      background: linear-gradient(145deg, #22252f, #14161d);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }

    .brand-icon-svg {
      width: 24px;
      height: 24px;
      fill: #f59e0b;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-main);
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-status-pill {
      display: none;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--admin-gold);
      color: var(--admin-gold);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      vertical-align: middle;
    }

    body.admin-mode .admin-status-pill {
      display: inline-block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-header-action {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }

    .btn-header-action:active {
      transform: scale(0.92);
      background: var(--bg-surface-elevated);
      border-color: var(--border-medium);
    }

    .btn-header-action svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Admin-only elements control */
    .admin-only {
      display: none !important;
    }

    body.admin-mode .admin-only {
      display: flex !important;
    }

    /* Search & Add Action Row */
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 11px 14px 11px 38px;
      color: #fff;
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--border-strong);
      background: var(--bg-surface-elevated);
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      fill: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .btn-add-item {
      background: var(--accent);
      color: var(--accent-dark);
      border: none;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 800;
      padding: 0 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: transform 0.15s;
    }

    .btn-add-item:active {
      transform: scale(0.95);
    }

    /* Category Bar with Vector Icons */
    .categories-wrap {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .categories-wrap::-webkit-scrollbar { display: none; }

    .cat-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 8px 13px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .cat-pill svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .cat-pill:hover {
      border-color: var(--border-medium);
      color: var(--text-secondary);
    }

    .cat-pill.active {
      background: var(--accent);
      color: var(--accent-dark);
      border-color: var(--accent);
    }

    .cat-pill.active svg {
      fill: var(--accent-dark);
    }

    .cat-pill.add-cat-btn {
      border-style: dashed;
      border-color: var(--border-medium);
      color: var(--text-secondary);
    }

    .btn-del-cat {
      display: none;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 10px;
      font-weight: 800;
      margin-left: 4px;
      cursor: pointer;
      line-height: 1;
      transition: all 0.15s;
    }

    .btn-del-cat:hover {
      background: var(--danger);
      color: #fff;
    }

    body.admin-mode .btn-del-cat {
      display: inline-flex;
    }

    /* Section Meta */
    .section-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    /* Items Grid */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .item-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .item-card:hover {
      border-color: var(--border-medium);
    }

    .item-img-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #090a0d;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .item-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.25s;
    }

    .item-card:hover .item-img {
      transform: scale(1.04);
    }

    .item-category-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(14, 15, 18, 0.88);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-subtle);
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-secondary);
      z-index: 2;
    }

    /* Product Badges */
    .item-promo-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      padding: 3px 7px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      color: #fff;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      letter-spacing: 0.3px;
    }
    .badge-hit { background: linear-gradient(135deg, #f97316, #ea580c); }
    .badge-sale { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .badge-new { background: linear-gradient(135deg, #06b6d4, #0284c7); }
    .badge-top { background: linear-gradient(135deg, #a855f7, #7c3aed); }

    /* Admin Action Controls inside Card */
    .admin-card-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: none;
      align-items: center;
      gap: 4px;
      z-index: 10;
    }

    body.admin-mode .admin-card-actions {
      display: flex !important;
    }

    body.admin-mode .item-promo-badge {
      display: none;
    }

    .btn-edit-item {
      background: rgba(245, 158, 11, 0.3);
      border: 1px solid var(--admin-gold);
      color: var(--admin-gold);
      border-radius: 6px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-delete-item {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 6px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .item-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 3px;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-desc {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      gap: 6px;
    }

    .item-price-wrap {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
      overflow: hidden;
    }

    .item-price-old {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: line-through;
      line-height: 1;
    }

    .item-price {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    /* Cart Quantity Controller inside Card */
    .card-cart-controls {
      display: flex;
      align-items: center;
      gap: 3px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 2px;
    }

    .btn-qty {
      background: none;
      border: none;
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .btn-qty:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .qty-display {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      min-width: 20px;
      text-align: center;
      color: var(--text-main);
    }

    .btn-first-add {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-medium);
      color: var(--text-main);
      padding: 6px 10px;
      height: 30px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .btn-first-add:hover {
      border-color: var(--accent);
      color: #fff;
    }

    .btn-first-add:active {
      transform: scale(0.92);
      background: var(--accent);
      color: #000;
    }

    .btn-clear-cart {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: var(--danger);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .btn-clear-cart svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .btn-clear-cart:hover {
      background: var(--danger);
      color: #fff;
    }

    .btn-clear-cart:active {
      transform: scale(0.95);
    }

    /* Empty state */
    .empty-state {
      grid-column: span 2;
      text-align: center;
      padding: 44px 20px;
      background: var(--bg-surface);
      border: 1px dashed var(--border-medium);
      border-radius: var(--radius-xl);
    }

    /* Floating Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(18, 20, 25, 0.96);
      border-top: 1px solid var(--border-medium);
      backdrop-filter: blur(20px);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)) 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    }

    .cart-info {
      display: flex;
      flex-direction: column;
    }

    .cart-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .cart-sum {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
    }

    .btn-checkout {
      background: var(--accent);
      color: var(--accent-dark);
      border: none;
      padding: 13px 22px;
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s;
    }

    .btn-checkout:active {
      transform: scale(0.96);
    }

    /* Modal / Bottom Drawer */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-sheet {
      background: #14161c;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      max-height: 88dvh;
      overflow-y: auto;
      padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px)) 18px;
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.8);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .modal-close {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
      display: block;
    }

    .form-input, .form-select {
      width: 100%;
      background: #0d0e12;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 11px 13px;
      color: #fff;
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--border-strong);
    }

    /* Gallery Photo Upload Box */
    .gallery-upload-box {
      border: 2px dashed var(--border-medium);
      background: rgba(0, 0, 0, 0.35);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
      min-height: 110px;
    }

    .gallery-upload-box:active {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.03);
    }

    .gallery-preview-img {
      width: 100%;
      max-height: 130px;
      object-fit: contain;
      border-radius: var(--radius-sm);
      display: none;
    }

    .file-input-hidden {
      display: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: var(--accent-dark);
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit-danger {
      width: 100%;
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px;
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Cart Item Row */
    .cart-row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d0e12;
      border: 1px solid var(--border-subtle);
      padding: 10px 12px;
      border-radius: var(--radius-md);
      margin-bottom: 8px;
    }

    .cart-row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .cart-row-img {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: #000;
    }

    .cart-row-info {
      flex: 1;
      overflow: hidden;
    }

    .cart-row-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-row-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <!-- Header -->
    <header>
      <div class="brand" onclick="checkAdminAccess()" title="NORVEX SHOP">

      <div class="form-group">

        <span style="font-size:10px; color:var(--text-muted); display:block; margin-top:4px;" id="currentDetectedTgUser">
          Определяется автоматически при открытии из Telegram.

    </div>
  </div>

  <script>
    // ==========================================
    // VECTOR SVG ICONS COLLECTION
    // ==========================================
    const SVG_ICONS = {
      all: `<svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>`,
      games: `<svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>`,
      key: `<svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>`,
      gem: `<svg viewBox="0 0 24 24"><path d="M19 3H5L2 9l10 12L22 9l-3-6zM9.62 8l1.5-3h1.76l1.5 3H9.62zM11 10v6.68L5.44 10H11zm2 0h5.56L13 16.68V10zm3.83-2h-2.22l-1.5-3h2.22l1.5 3zM7.39 5l1.5 3H6.67l-1.5-3h2.22z"/></svg>`,
      pass: `<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>`,
      skin: `<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>`,
      flash: `<svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>`
    };

    // ==========================================
    // TMA INITIALIZATION & TELEGRAM ID AUTH
    // ==========================================
    let currentTgUser = null;
    try {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        if (window.Telegram.WebApp.disableVerticalSwipes) {
          window.Telegram.WebApp.disableVerticalSwipes();
        }
        currentTgUser = window.Telegram.WebApp.initDataUnsafe?.user || null;
      }
    } catch(e) {
      console.warn("Telegram WebApp init bypass:", e);
    }

    // ==========================================
    // STATE MANAGEMENT WITH DISCOUNTS & DEMO DATA
    // ==========================================
    const DEFAULT_CATEGORIES = [
      { id: 'all', name: 'Все товары', iconKey: 'all' },
      { id: 'keys', name: 'Ключи & Игры', iconKey: 'key' },
      { id: 'donate', name: 'Донат & Валюта', iconKey: 'gem' },
      { id: 'passes', name: 'Подписки & Pass', iconKey: 'pass' }
    ];

    const DEFAULT_PRODUCTS = [
      {
        id: "1",
        name: "Steam Gift Card 1000 ₽ (Турция / РФ)",
        catId: "keys",
        price: 1090,
        oldPrice: 1390,
        badge: "hit",
        img: "https://images.unsplash.com/photo-1612287233207-68b3543d34d8?auto=format&fit=crop&w=400&q=80",
        desc: "Автовыдача кода • Мгновенно"
      },
      {
        id: "2",
        name: "Genshin Impact: 980+110 Кристаллов",
        catId: "donate",
        price: 1390,
        oldPrice: 1750,
        badge: "sale",
        img: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=400&q=80",
        desc: "Пополнение по UID • Все сервера"
      },
      {
        id: "3",
        name: "Discord Nitro Full (1 Месяц)",
        catId: "passes",
        price: 450,
        oldPrice: 650,
        badge: "top",
        img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80",
        desc: "2 Буста • 4K Стримы • Гарантия"
      },
      {
        id: "4",
        name: "Brawl Stars: Brawl Pass Plus",
        catId: "donate",
        price: 890,
        oldPrice: 1190,
        badge: "new",
        img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80",
        desc: "Активация через Supercell ID"
      }
    ];

    let categories = [];
    try {
      categories = JSON.parse(localStorage.getItem('norvex_cats')) || DEFAULT_CATEGORIES;
    } catch(e) {
      categories = DEFAULT_CATEGORIES;
    }

    let rawProducts = [];
    try {
      rawProducts = JSON.parse(localStorage.getItem('norvex_prods')) || DEFAULT_PRODUCTS;
    } catch(e) {
      rawProducts = DEFAULT_PRODUCTS;
    }

    let rawCart = [];
    try {
      rawCart = JSON.parse(localStorage.getItem('norvex_cart')) || [];
    } catch(e) {
      rawCart = [];
    }

    // Robust Sanitization
    let products = rawProducts.map(p => ({
      ...p,
      id: String(p.id),
      price: parseInt(p.price) || 0,
      oldPrice: parseInt(p.oldPrice) || 0
    }));

    let cart = (Array.isArray(rawCart) ? rawCart : []).map(c => ({
      ...c,
      id: String(c.id),
      name: c.name || 'Товар',
      price: parseInt(c.price) || 0,
      img: c.img || '',
      qty: parseInt(c.qty) || 1
    })).filter(c => c.qty > 0 && c.price >= 0);

    let activeCategory = 'all';
    let currentUploadedBase64 = '';
    let editingProductId = null;
    
    let tgBotHandle = localStorage.getItem('norvex_tg_bot_handle') || 'NorvexShopBot';
    let storeTitle = localStorage.getItem('norvex_title') || 'NORVEX SHOP';
    let adminTgIds = localStorage.getItem('norvex_admin_tg_ids') || '';
    
    let isAdmin = true; // Default admin enabled for preview

    window.checkAdminAccess = function() {
      if (currentTgUser) {
        const uid = String(currentTgUser.id);
        const uname = (currentTgUser.username || '').toLowerCase();
        const allowed = adminTgIds.toLowerCase().split(',').map(s => s.trim().replace('@', '')).filter(Boolean);
        
        if (allowed.length === 0 || allowed.includes(uid) || (uname && allowed.includes(uname))) {
          isAdmin = true;
        } else {
          isAdmin = false;
        }
      } else {
        isAdmin = true;
      }
      updateAdminUI();
    };

    function saveState() {
      try {
        localStorage.setItem('norvex_cats', JSON.stringify(categories));
        localStorage.setItem('norvex_prods', JSON.stringify(products));
        localStorage.setItem('norvex_cart', JSON.stringify(cart));
      } catch(e) {
        console.error("saveState error:", e);
      }
    }

    function updateAdminUI() {
      if (isAdmin) {
        document.body.classList.add('admin-mode');
      } else {
        document.body.classList.remove('admin-mode');
      }
      renderCategories();
      renderProducts();
    }

    // ==========================================
    // GALLERY PHOTO UPLOAD
    // ==========================================
    window.handleFileSelected = function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        currentUploadedBase64 = evt.target.result;
        const imgEl = document.getElementById('uploadImgPreview');
        const promptEl = document.getElementById('uploadPrompt');
        imgEl.src = currentUploadedBase64;
        imgEl.style.display = 'block';
        promptEl.style.display = 'none';
      };
      reader.readAsDataURL(file);
    };

    function resetPhotoUpload(existingImg = '') {
      currentUploadedBase64 = existingImg;
      const fileInp = document.getElementById('inpFilePhoto');
      if (fileInp) fileInp.value = '';
      const imgEl = document.getElementById('uploadImgPreview');
      const promptEl = document.getElementById('uploadPrompt');
      if (existingImg) {
        imgEl.src = existingImg;
        imgEl.style.display = 'block';
        promptEl.style.display = 'none';
      } else {
        imgEl.src = '';
        imgEl.style.display = 'none';
        promptEl.style.display = 'block';
      }
    }

    // ==========================================
    // RENDERING & BADGES
    // ==========================================
    function getBadgeHtml(badge, price, oldPrice) {
      if (badge === 'hit') return '<span class="item-promo-badge badge-hit">🔥 ХИТ</span>';
      if (badge === 'sale') return '<span class="item-promo-badge badge-sale">⚡ СКИДКА</span>';
      if (badge === 'new') return '<span class="item-promo-badge badge-new">✨ NEW</span>';
      if (badge === 'top') return '<span class="item-promo-badge badge-top">💎 ТОП</span>';
      
      if (oldPrice && oldPrice > price) {
        const pct = Math.round((1 - price / oldPrice) * 100);
        return `<span class="item-promo-badge badge-sale">−${pct}%</span>`;
      }
      return '';
    }

    function renderCategories() {
      const bar = document.getElementById('categoriesBar');
      const select = document.getElementById('inpProdCat');
      if (!bar) return;

      let addCatBtnHtml = '';
      if (isAdmin) {
        addCatBtnHtml = `
          <button class="cat-pill add-cat-btn" onclick="openAddCatModal()">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Категория
          </button>
        `;
      }

      bar.innerHTML = categories.map(cat => {
        const svgIcon = SVG_ICONS[cat.iconKey] || SVG_ICONS['games'];
        const isAll = cat.id === 'all';
        const deleteBtnHtml = (!isAll && isAdmin) ? `
          <span class="btn-del-cat" onclick="event.stopPropagation(); deleteCategory('${cat.id}')" title="Удалить категорию">✕</span>
        ` : '';

        return `
          <button class="cat-pill ${cat.id === activeCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
            ${svgIcon} <span>${cat.name}</span>
            ${deleteBtnHtml}
          </button>
        `;
      }).join('') + addCatBtnHtml;

      if (select) {
        select.innerHTML = categories.filter(c => c.id !== 'all').map(c => `
          <option value="${c.id}">${c.name}</option>
        `).join('');
      }
    }

    function renderProducts() {
      const grid = document.getElementById('itemsGrid');
      if (!grid) return;

      const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

      let filtered = products;
      if (activeCategory !== 'all') {
        filtered = filtered.filter(p => p.catId === activeCategory);
      }
      if (q) {
        filtered = filtered.filter(p => p.name.toLowerCase().includes(q) || (p.desc && p.desc.toLowerCase().includes(q)));
      }

      const gridCountEl = document.getElementById('gridCountLabel');
      if (gridCountEl) gridCountEl.innerText = `КАТАЛОГ (${filtered.length})`;

      const curCat = categories.find(c => c.id === activeCategory);
      const activeCatNameEl = document.getElementById('activeCategoryName');
      if (activeCatNameEl) activeCatNameEl.innerText = curCat ? curCat.name : 'Все товары';

      if (filtered.length === 0) {
        const adminAddBtn = isAdmin ? `
          <button class="btn-add-item" style="display:inline-flex; padding:8px 16px; margin:0 auto;" onclick="openProductModal()">
            + Добавить товар
          </button>
        ` : '';

        grid.innerHTML = `
          <div class="empty-state">
            <div style="font-size:32px; margin-bottom:6px;">📦</div>
            <div style="font-weight:700; font-size:14px; margin-bottom:4px;">Товаров пока нет</div>
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:12px;">Каталог в данной категории пуст.</div>
            ${adminAddBtn}
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const catObj = categories.find(c => c.id === p.catId);
        const catName = catObj ? catObj.name : 'Товар';
        const hasDiscount = p.oldPrice && p.oldPrice > p.price;
        const displayPrice = `${Number(p.price).toLocaleString()} ₽`;
        const oldPriceHtml = hasDiscount ? `<span class="item-price-old">${Number(p.oldPrice).toLocaleString()} ₽</span>` : '';
        const imgSrc = p.img || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=300&q=80';
        const badgeHtml = getBadgeHtml(p.badge, p.price, p.oldPrice);

        const cartItem = cart.find(c => String(c.id) === String(p.id));
        const qty = cartItem ? (parseInt(cartItem.qty) || 0) : 0;

        return `
          <div class="item-card">
            <div class="item-img-box">
              <span class="item-category-tag">${catName}</span>
              ${badgeHtml}
              
              <!-- Direct Admin Edit and Delete Actions -->
              <div class="admin-card-actions admin-only">
                <button class="btn-edit-item" onclick="event.stopPropagation(); openProductModal('${p.id}')" title="Редактировать товар">✏️</button>
                <button class="btn-delete-item" onclick="event.stopPropagation(); deleteProduct('${p.id}')" title="Удалить товар">✕</button>
              </div>

              <img src="${imgSrc}" class="item-img" loading="lazy">
            </div>
            <div class="item-name">${p.name}</div>
            <div class="item-desc">${p.desc || 'В наличии'}</div>
            <div class="item-footer">
              <div class="item-price-wrap">
                ${oldPriceHtml}
                <div class="item-price">${displayPrice}</div>
              </div>
              
              <div class="card-cart-controls">
                ${qty > 0 ? `
                  <button class="btn-qty" onclick="event.stopPropagation(); changeQty('${p.id}', -1)">−</button>
                  <span class="qty-display">${qty}</span>
                  <button class="btn-qty" onclick="event.stopPropagation(); changeQty('${p.id}', 1)">+</button>
                ` : `
                  <button class="btn-first-add" onclick="event.stopPropagation(); changeQty('${p.id}', 1)">+ В корзину</button>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.selectCategory = function(catId) {
      activeCategory = catId;
      renderCategories();
      renderProducts();
    };

    // ==========================================
    // CART MANAGEMENT (+/- QUANTITY)
    // ==========================================
    window.changeQty = function(productId, delta) {
      try {
        const pId = String(productId);
        const existingIndex = cart.findIndex(c => String(c.id) === pId);

        if (existingIndex !== -1) {
          const currentQty = parseInt(cart[existingIndex].qty) || 0;
          const newQty = currentQty + delta;
          if (newQty <= 0) {
            cart.splice(existingIndex, 1);
          } else {
            cart[existingIndex].qty = newQty;
          }
        } else if (delta > 0) {
          const prod = products.find(p => String(p.id) === pId);
          if (prod) {
            cart.push({
              id: pId,
              name: prod.name,
              price: parseInt(prod.price) || 0,
              img: prod.img || '',
              qty: 1
            });
          }
        }

        saveState();
        renderProducts();
        updateCartUI();
        renderCartModalList();

        try {
          if (window.Telegram?.WebApp?.HapticFeedback?.impactOccurred) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
          }
        } catch (e) {}
      } catch (err) {
        console.error("Error in changeQty:", err);
      }
    };

    window.clearCart = function() {
      try {
        if (!cart || cart.length === 0) {
          alert("Корзина уже пуста!");
          return;
        }
        cart = [];
        saveState();
        renderProducts();
        updateCartUI();
        renderCartModalList();
        closeModal('modalCart');
        try {
          if (window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred) {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred('warning');
          }
        } catch (e) {}
      } catch (err) {
        console.error("Error in clearCart:", err);
      }
    };

    function updateCartUI() {
      try {
        const totalCount = cart.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
        const totalRub = cart.reduce((sum, item) => sum + ((parseInt(item.price) || 0) * (parseInt(item.qty) || 0)), 0);

        const countEl = document.getElementById('cartCount');
        const sumEl = document.getElementById('cartTotalSum');
        const modalSumEl = document.getElementById('modalCartTotalSum');

        if (countEl) countEl.innerText = totalCount;
        if (sumEl) sumEl.innerText = `${totalRub.toLocaleString()} ₽`;
        if (modalSumEl) modalSumEl.innerText = `${totalRub.toLocaleString()} ₽`;
      } catch(e) {
        console.error("updateCartUI error:", e);
      }
    }

    function renderCartModalList() {
      const list = document.getElementById('cartItemsList');
      if (!list) return;

      if (!cart || cart.length === 0) {
        list.innerHTML = `
          <div style="text-align:center; padding:20px 0; color:var(--text-muted); font-size:13px;">
            Корзина пуста
          </div>
        `;
        return;
      }

      list.innerHTML = cart.map(item => {
        const itemPrice = parseInt(item.price) || 0;
        const itemQty = parseInt(item.qty) || 0;
        const subtotal = itemPrice * itemQty;
        const imgSrc = item.img || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=300&q=80';

        return `
          <div class="cart-row-item">
            <div class="cart-row-left">
              <img src="${imgSrc}" class="cart-row-img">
              <div class="cart-row-info">
                <div class="cart-row-title">${item.name}</div>
                <div class="cart-row-sub">${itemPrice.toLocaleString()} ₽ × ${itemQty} шт. = ${subtotal.toLocaleString()} ₽</div>
              </div>
            </div>
            <div class="card-cart-controls" style="margin-left:8px;">
              <button class="btn-qty" onclick="event.stopPropagation(); changeQty('${item.id}', -1)">−</button>
              <span class="qty-display">${itemQty}</span>
              <button class="btn-qty" onclick="event.stopPropagation(); changeQty('${item.id}', 1)">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.openCartModal = function() {
      if (cart.length === 0) {
        alert("Корзина пуста! Добавьте товары кнопкой [+ В корзину]");
        return;
      }

      renderCartModalList();
      updateCartUI();
      document.getElementById('modalCart').style.display = 'flex';
    };

    // ==========================================
    // ORDER SUBMISSION TO TELEGRAM BOT
    // ==========================================
    window.proceedToBotOrder = function() {
      if (cart.length === 0) return;

      const cleanBot = tgBotHandle.replace('@', '').trim();
      const totalRub = cart.reduce((sum, item) => sum + ((parseInt(item.price) || 0) * (parseInt(item.qty) || 0)), 0);
      const totalCount = cart.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);

      const orderPayload = {
        type: "norvex_order",
        orderId: 'NVX-' + Date.now().toString().slice(-6),
        items: cart.map(i => ({ id: String(i.id), name: i.name, qty: parseInt(i.qty) || 1, price: parseInt(i.price) || 0 })),
        totalCount,
        totalRub,
        timestamp: new Date().toISOString()
      };

      let msg = `👋 Здравствуйте! Хочу оформить заказ [${orderPayload.orderId}]:\n\n`;
      cart.forEach((item, index) => {
        msg += `${index + 1}. ${item.name} — ${item.qty} шт. × ${item.price.toLocaleString()} ₽\n`;
      });
      msg += `\n💵 Итого: ${totalRub.toLocaleString()} ₽`;

      if (window.Telegram?.WebApp?.sendData) {
        try {
          if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          }
          window.Telegram.WebApp.sendData(JSON.stringify(orderPayload));
          closeModal('modalCart');
          return;
        } catch (e) {
          console.warn("sendData not available, using deep link", e);
        }
      }

      const encodedMsg = encodeURIComponent(msg);
      const directChatUrl = `https://t.me/${cleanBot}?text=${encodedMsg}`;

      if (window.Telegram?.WebApp?.openTelegramLink) {
        window.Telegram.WebApp.openTelegramLink(directChatUrl);
      } else {
        window.open(directChatUrl, '_blank');
      }

      closeModal('modalCart');
    };

    // ==========================================
    // ADMIN ACTIONS: ADD / EDIT PRODUCT & CATEGORY
    // ==========================================
    window.openProductModal = function(productId = null) {
      if (!isAdmin) return;

      if (categories.filter(c => c.id !== 'all').length === 0) {
        alert("Сначала создайте категорию кнопкой [+ Категория]!");
        openAddCatModal();
        return;
      }

      editingProductId = productId;

      if (productId) {
        const prod = products.find(p => String(p.id) === String(productId));
        if (!prod) return;

        document.getElementById('productModalTitle').innerText = "РЕДАКТИРОВАТЬ ТОВАР (АДМИН)";
        document.getElementById('btnSaveProductSubmit').innerText = "СОХРАНИТЬ ИЗМЕНЕНИЯ";
        document.getElementById('inpProdName').value = prod.name;
        document.getElementById('inpProdCat').value = prod.catId;
        document.getElementById('inpProdBadge').value = prod.badge || '';
        document.getElementById('inpProdPrice').value = prod.price;
        document.getElementById('inpProdOldPrice').value = prod.oldPrice || '';
        document.getElementById('inpProdDesc').value = prod.desc || '';
        resetPhotoUpload(prod.img || '');
      } else {
        document.getElementById('productModalTitle').innerText = "ДОБАВИТЬ ТОВАР (АДМИН)";
        document.getElementById('btnSaveProductSubmit').innerText = "СОХРАНИТЬ ТОВАР";
        document.getElementById('inpProdName').value = '';
        if (activeCategory !== 'all') {
          document.getElementById('inpProdCat').value = activeCategory;
        }
        document.getElementById('inpProdBadge').value = '';
        document.getElementById('inpProdPrice').value = '';
        document.getElementById('inpProdOldPrice').value = '';
        document.getElementById('inpProdDesc').value = '';
        resetPhotoUpload('');
      }

      document.getElementById('modalProductForm').style.display = 'flex';
    };

    window.saveProductForm = function() {
      const name = document.getElementById('inpProdName').value.trim();
      const catId = document.getElementById('inpProdCat').value || 'keys';
      const badge = document.getElementById('inpProdBadge').value;
      const price = parseInt(document.getElementById('inpProdPrice').value) || 0;
      const oldPrice = parseInt(document.getElementById('inpProdOldPrice').value) || 0;
      const desc = document.getElementById('inpProdDesc').value.trim();

      if (!name || price <= 0) {
        alert("Пожалуйста, укажите название и цену товара!");
        return;
      }

      try {
        if (editingProductId) {
          const index = products.findIndex(p => String(p.id) === String(editingProductId));
          if (index !== -1) {
            products[index] = {
              ...products[index],
              name,
              catId,
              badge,
              price,
              oldPrice: oldPrice > price ? oldPrice : 0,
              desc: desc || 'В наличии • Мгновенно',
              img: currentUploadedBase64 || products[index].img
            };

            const cartItem = cart.find(c => String(c.id) === String(editingProductId));
            if (cartItem) {
              cartItem.name = name;
              cartItem.price = price;
              cartItem.img = products[index].img;
            }
          }
        } else {
          const newProd = {
            id: String(Date.now()),
            name,
            catId,
            badge,
            price,
            oldPrice: oldPrice > price ? oldPrice : 0,
            img: currentUploadedBase64 || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=300&q=80',
            desc: desc || 'В наличии • Мгновенно'
          };
          products.unshift(newProd);
        }

        saveState();
        renderProducts();
        updateCartUI();
        try {
          if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          }
        } catch(e) {}
      } catch (err) {
        console.error("Error saving product:", err);
      } finally {
        editingProductId = null;
        closeModal('modalProductForm');
      }
    };

    window.deleteProduct = function(id) {
      products = products.filter(p => String(p.id) !== String(id));
      cart = cart.filter(p => String(p.id) !== String(id));
      saveState();
      renderProducts();
      updateCartUI();
      renderCartModalList();
      try {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        }
      } catch(e) {}
    };

    window.openAddCatModal = function() {
      if (!isAdmin) return;
      document.getElementById('inpCatName').value = '';
      document.getElementById('modalAddCat').style.display = 'flex';
    };

    window.saveNewCategory = function() {
      const name = document.getElementById('inpCatName').value.trim();
      const iconKey = document.getElementById('inpCatIconType').value || 'games';
      if (!name) {
        alert("Введите название категории!");
        return;
      }
      const id = 'cat_' + Date.now();
      categories.push({ id, name, iconKey });
      saveState();
      renderCategories();
      selectCategory(id);
      closeModal('modalAddCat');
      document.getElementById('inpCatName').value = '';
    };

    window.deleteCategory = function(catId) {
      categories = categories.filter(c => c.id !== catId);
      if (activeCategory === catId) {
        activeCategory = 'all';
      }
      saveState();
      renderCategories();
      renderProducts();
    };

    window.openSettingsModal = function() {
      document.getElementById('inpTgBotUsername').value = tgBotHandle;
      document.getElementById('inpAdminTgIds').value = adminTgIds;
      document.getElementById('inpStoreTitle').value = storeTitle;

      const detectedEl = document.getElementById('currentDetectedTgUser');
      if (currentTgUser) {
        detectedEl.innerHTML = `Ваш Telegram: <b>ID ${currentTgUser.id}</b> (@${currentTgUser.username || 'нет username'})`;
      } else {
        detectedEl.innerHTML = `Запущено в браузере (вне Telegram)`;
      }

      document.getElementById('modalSettings').style.display = 'flex';
    };

    window.saveSettings = function() {
      const botHandle = document.getElementById('inpTgBotUsername').value.trim().replace('@', '');
      const adminIds = document.getElementById('inpAdminTgIds').value.trim();
      const title = document.getElementById('inpStoreTitle').value.trim();

      if (botHandle) {
        tgBotHandle = botHandle;
        localStorage.setItem('norvex_tg_bot_handle', tgBotHandle);
      }
      if (adminIds !== undefined) {
        adminTgIds = adminIds;
        localStorage.setItem('norvex_admin_tg_ids', adminTgIds);
      }
      if (title) {
        storeTitle = title;
        localStorage.setItem('norvex_title', storeTitle);
        document.getElementById('storeNameText').innerText = storeTitle;
      }

      checkAdminAccess();
      updateAdminUI();
      closeModal('modalSettings');
      alert("✅ Настройки магазина сохранены!");
    };

    window.closeModal = function(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    };

    window.handleBackdropClick = function(event, modalId) {
      if (event.target === document.getElementById(modalId)) {
        closeModal(modalId);
      }
    };

    document.getElementById('searchInput')?.addEventListener('input', () => {
      renderProducts();
    });

    // Initialize
    document.getElementById('storeNameText').innerText = storeTitle;
    updateAdminUI();
    updateCartUI();
  </script>
</body>
</html>
